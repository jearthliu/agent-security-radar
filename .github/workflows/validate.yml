name: Validate radar catalog

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install check-jsonschema==0.35.0
      - name: Validate JSON Schema
        run: check-jsonschema --schemafile data/papers.schema.json data/papers.json
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run catalog validator
        run: python scripts/validate_catalog.py data/papers.json
